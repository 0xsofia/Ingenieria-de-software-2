services:
  db:
    image: postgres:16-alpine
    container_name: inge2-db
    environment:
      POSTGRES_USER: davo
      POSTGRES_PASSWORD: koda01
      POSTGRES_DB: inge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davo -d inge"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: inge2-mailpit
    ports:
      - "2525:1025"

  backend:
    build:
      context: ./App-Centro-De-Actividades/Backend
    container_name: inge2-backend
    env_file:
      - ./App-Centro-De-Actividades/Backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./App-Centro-De-Actividades/Backend:/app

  frontend:
    build:
      context: ./App-Centro-De-Actividades/Frontend
    container_name: inge2-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: "http://backend:5000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./App-Centro-De-Actividades/Frontend:/app
      - /app/node_modules

  ngrok:
    image: ngrok/ngrok:latest
    container_name: inge2-ngrok
    depends_on:
      - frontend
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["start", "--all", "--config", "/etc/ngrok/ngrok.yml"]
    volumes:
      - ./ngrok/ngrok.docker.yml:/etc/ngrok/ngrok.yml:ro
    ports:
      - "4040:4040"

volumes:
  postgres_data:
